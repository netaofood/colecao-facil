<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Coleção Fácil</title>
    <meta name="description" content="Organize suas coleções, controle o que falta e ache suas trocas." />
    <meta name="theme-color" content="#00B4FF" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coleção Fácil" />

    <meta property="og:title" content="Coleção Fácil" />
    <meta property="og:description" content="Organize suas coleções, controle o que falta e ache suas trocas." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
  </head>
  <body>
    <script>
      // Aplica o tema antes de pintar a tela, para não piscar.
      (function () {
        try {
          var t = localStorage.getItem('colecao-facil-tema');
          if (!t) {
            t = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'claro'
              : 'escuro';
          }
          if (t === 'claro') {
            document.documentElement.setAttribute('data-tema', 'claro');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#FFFFFF');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
